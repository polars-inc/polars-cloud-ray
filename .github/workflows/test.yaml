name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      compute-version:
        description: Version of the polars-nanook-compute package to test against
        required: false
        type: string
      license-server-version:
        description: Version of the Polars License Server binary to test against
        required: false
        type: string

env:
  COMPUTE_VERSION: ${{ inputs.compute-version }}
  LICENSE_SERVER_VERSION: ${{ inputs.license-server-version || '0.1.1' }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.WORKFLOW }}-${{ github.REF }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  integration:
    name: integration (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # no docker run on github's macos runners: ray only ships arm64 wheels for
        # macos, and the arm64 runners lack the nested virtualization docker needs
        # running our docker tests under linux, better than nothing
        runtime:
          - docker
          - subprocess
    timeout-minutes: 15
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Check out codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/astral-sh-setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          cache-python: true
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          python-version: "3.12"

      - name: Materialize the license
        run: |
          mkdir --parents _etc
          echo "$LICENSE" > _etc/license.json
        env:
          LICENSE: ${{ secrets.LICENSE }}

      - name: Install dependencies
        run: |
          make .venv
          source .venv/bin/activate
          uv pip install pytest-github-actions-annotate-failures
          if [[ -n "$COMPUTE_VERSION" ]]; then
            uv pip install "polars-nanook-compute==$COMPUTE_VERSION"
          fi

      - name: Build the image
        if: ${{ matrix.runtime == 'docker' }}
        run: |
          source .venv/bin/activate
          make image COMPUTE_VERSION=$(python -c "import importlib.metadata; print(importlib.metadata.version('polars-nanook-compute'))")

      - name: Run integration tests
        run: |
          make "test-$RUNTIME"
        env:
          RUNTIME: ${{ matrix.runtime }}
        timeout-minutes: 10

  integration-license-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # https://github.com/marketplace/actions/checkout
      - name: Check out codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # https://github.com/marketplace/actions/astral-sh-setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          cache-python: true
          enable-cache: true
          ignore-nothing-to-cache: true
          prune-cache: false
          python-version: "3.12"

      - name: Download the license server binary
        run: |
          mkdir --parents _bin
          wget --no-verbose https://cdn.onprem.pola.rs/polars-nanook-license-server-$LICENSE_SERVER_VERSION-linux-x64 --output-document=_bin/polars-nanook-license-server
          chmod +x _bin/polars-nanook-license-server

      - name: Materialize the license and TLS bundle
        run: |
          mkdir --parents _etc
          echo "$LICENSE" > _etc/license.json
          echo "$TLS_BUNDLE" > _etc/tls-bundle.pem
        env:
          LICENSE: ${{ secrets.LICENSE }}
          TLS_BUNDLE: ${{ secrets.TLS_BUNDLE }}

      - name: Install dependencies
        run: |
          make .venv
          source .venv/bin/activate
          uv pip install pytest-github-actions-annotate-failures
          if [[ -n "$COMPUTE_VERSION" ]]; then
            uv pip install "polars-nanook-compute==$COMPUTE_VERSION"
          fi

      - name: Run license server tests (5 mins idling time)
        run: |
          make test-license-server
        timeout-minutes: 10
